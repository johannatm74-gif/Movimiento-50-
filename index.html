<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2f7" />
  <title>Movimiento 50 Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Movimiento 50 Pro</div>
        <div class="subtitle">Fuerza · Equilibrio · Bienestar</div>
      </div>
      <button class="icon-btn" id="accessBtn" aria-label="Accesibilidad">Aa</button>
    </header>

    <section id="view"></section>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-btn active"><span>⌂</span>Inicio</button>
      <button data-route="routines" class="nav-btn"><span>◉</span>Rutinas</button>
      <button data-route="health" class="nav-btn"><span>♥</span>Mi salud</button>
      <button data-route="progress" class="nav-btn"><span>▥</span>Progreso</button>
    </nav>
  </main>

  <template id="avatar-template">
    <div class="avatar-stage">
      <div class="avatar">
        <div class="head"></div>
        <div class="torso"></div>
        <div class="arm arm-l"></div>
        <div class="arm arm-r"></div>
        <div class="leg leg-l"></div>
        <div class="leg leg-r"></div>
      </div>
      <div class="floor"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
